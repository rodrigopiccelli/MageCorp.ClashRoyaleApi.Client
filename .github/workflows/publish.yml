# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# The previous line enables IntelliSense for this file.
# See this post for more info https://www.meziantou.net/enabling-intellisense-for-github-actions-workflows-in-vs-code.htm

name: publish
on:
  pull_request:
    types: [closed]
    branches:
      - 'master'

permissions: {}

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  NuGetDirectory: ${{ github.workspace }}/nuget

defaults:
  run:
    shell: pwsh

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      ApiSettings__ValidBearerToken: ${{ secrets.INTEGRATION_API_TOKEN }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      with:
        fetch-depth: 0

    - name: Setup dotnet
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
      with:
        dotnet-version: |
          10.0.x
          9.0.x

    - name: Install GitVersion
      run: dotnet tool update --global GitVersion.Tool --version 6.*

    - name: Determine package version
      id: gitversion
      run: |
        $gitVersion = dotnet-gitversion | ConvertFrom-Json
        $version = $gitVersion.MajorMinorPatch
        "package_version=$version" >> $env:GITHUB_OUTPUT
        "package_version=$version" >> $env:GITHUB_ENV

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Run tests (net9.0)
      env:
        ApiSettings__ValidBearerToken: ${{ secrets.INTEGRATION_API_TOKEN }}
      run: dotnet test --configuration Release --framework net9.0 --no-build

    - name: Run tests (net10.0)
      env:
        ApiSettings__ValidBearerToken: ${{ secrets.INTEGRATION_API_TOKEN }}
      run: dotnet test --configuration Release --framework net10.0 --no-build

    - name: Pack
      env:
        PACKAGE_VERSION: ${{ steps.gitversion.outputs.package_version }}
      run: dotnet pack MageCorp.ClashRoyaleApi.Client/MageCorp.ClashRoyaleApi.Client.csproj --configuration Release --no-build --output ${{ env.NuGetDirectory }} /p:PackageVersion=$env:PACKAGE_VERSION

    - name: Validate package version is new
      env:
        PACKAGE_VERSION: ${{ steps.gitversion.outputs.package_version }}
      run: |
        $packageId = "MageCorp.ClashRoyaleApi.Client"
        $version = $env:PACKAGE_VERSION
        $indexUrl = "https://api.nuget.org/v3-flatcontainer/$($packageId.ToLower())/index.json"
        $response = Invoke-RestMethod -Uri $indexUrl
        if ($response.versions -contains $version) {
          throw "Version '$version' already exists on NuGet for package '$packageId'."
        }

    - name: Install NuGet validator
      run: dotnet tool update Meziantou.Framework.NuGetPackageValidation.Tool --global

    - name: Validate package
      run: |
        $package = Get-ChildItem "${{ env.NuGetDirectory }}/*.nupkg" | Where-Object { $_.Name -notlike "*.snupkg" }
        meziantou.validate-nuget-package $package

    - name: NuGet login (OIDC -> temp API key)
      id: nuget_login
      uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841  # v1.2.0
      with:
        user: ${{ github.repository_owner }}

    - name: Publish NuGet package
      env:
        NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
      run: |
        foreach($file in (Get-ChildItem "${{ env.NuGetDirectory }}/*.nupkg" | Where-Object { $_.Name -notlike "*.snupkg" })) {
          dotnet nuget push $file --api-key "$env:NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate --no-symbols
        }

    - name: Create GitHub release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PACKAGE_VERSION: ${{ steps.gitversion.outputs.package_version }}
      run: |
        $package = "${{ env.NuGetDirectory }}/MageCorp.ClashRoyaleApi.Client.$env:PACKAGE_VERSION.nupkg"
        gh release create "$env:PACKAGE_VERSION" "$package" --title "$env:PACKAGE_VERSION" --generate-notes

  
